<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>quiz game</title>
</head>
<body>
    <div id="main">
        <div class="active screen" id="start-screen">
            <h1>Quiz time</h1>
            <p>Test you knowledge with these fun question</p>
            <button id="start-btn">Start Quiz</button> 
        </div>

        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> of <span id="">5</span></p>
                    <p>Score: <span id="current-score">0</span></p>
                </div>
            </div>

            <div id="answers-container" class="answers-container">
                <!-- Answer button will be inserted here using javascript later at some point automatically -->
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>

                <div id="result-message">Good Job</div>
            </div>
            <button id="restart-btn">Restart Quiz</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
