<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="section">
            <div class="infos">

                <div class="info">
                    <h4>High Score:
                        <span id="high-score">00</span>
                    </h4>
                </div>

                <div class="info">
                    <h4>Timer:
                        <span id="time">00-00</span>
                    </h4>
                </div>

                <div class="info">
                    <h4>Score:
                        <span id="score">00</span>
                    </h4>
                </div>
                
                
                
            </div>
            <div id="board" class="board">
            </div>
            
        </div>

        <div class="model" id="model">
            <div class="st-game" id="start-game">
                <h1>Welcome to the Snake Game!</h1>
                <button class="btn st-btn" id="st-btn">Start Game</button>
            </div>

            <div class="restart-game" id="restart-game">
                <h1>Game over</h1>
                <button class="btn" id="restart-btn">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
