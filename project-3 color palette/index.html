<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <button class="generate-btn" id="generate-btn">
            <i class="fas fa-sync-alt"></i>
            Generator Palette
        </button>
        <div class="palette-container">

            <!-- COLOR BOX 1 -->
             <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#E1F5FE</span>
                    <i class="far fa-copy copy-btn copy" title="Copy to clipboard"></i>
                </div>
             </div>

            <!-- COLOR BOX 2 -->
             <div class="color-box">
                <div class="color" style="background-color: #afecda;"></div>
                <div class="color-info">
                    <span class="hex-value">#AFECDA</span>
                    <i class="far fa-copy copy-btn copy" title="Copy to clipboard"></i>
                </div>
             </div>

            <!-- COLOR BOX 3 -->
             <div class="color-box">
                <div class="color" style="background-color: #8ec9e5;"></div>
                <div class="color-info">
                    <span class="hex-value">#8EC9E5</span>
                    <i class="far fa-copy copy-btn copy" title="Copy to clipboard"></i>
                </div>
             </div>

            <!-- COLOR BOX 4 -->
             <div class="color-box">
                <div class="color" style="background-color: #e984bc;"></div>
                <div class="color-info">
                    <span class="hex-value">#E984BC</span>
                    <i class="far fa-copy copy-btn copy" title="Copy to clipboard"></i>
                </div>
             </div>

            <!-- COLOR BOX 5 -->
             <div class="color-box">
                <div class="color" style="background-color: #e99f84;"></div>
                <div class="color-info">
                    <span class="hex-value">#E99F84</span>
                    <i class="far fa-copy copy-btn copy" title="Copy to clipboard"></i>
                </div>
             </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
